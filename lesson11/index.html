<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Journey - Hướng dẫn rửa tay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes correct {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        @keyframes incorrect {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
        
        .correct-animation {
            animation: correct 0.5s ease-in-out;
        }
        
        .incorrect-animation {
            animation: incorrect 0.4s ease-in-out;
        }
        
        .progress-bar {
            transition: width 0.3s ease-in-out;
        }
        
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
            overflow: hidden;
        }
        
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Ngăn người dùng tương tác với video */
        }
        
        .option-btn {
            transition: all 0.2s ease;
        }
        
        .option-btn:hover {
            transform: translateY(-2px);
        }
        
        .sensory-friendly {
            background-color: #f0f7ff;
            color: #333;
            font-family: 'Arial', sans-serif;
        }
        
        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 4px solid #3498db;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #start-screen { z-index: 10; }
    </style>
</head>
<body class="sensory-friendly min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-bold text-blue-600 mb-2">Learning Journey</h1>
            <p class="text-lg text-gray-700">Interactive lessons designed for children with autism</p>
            <div class="w-full bg-gray-200 rounded-full h-4 mt-4">
                <div id="progress-bar" class="progress-bar bg-blue-500 h-4 rounded-full" style="width: 0%"></div>
            </div>
        </header>
        
        <!-- Main Content -->
        <main>
            <!-- Video Player Section -->
            <section id="video-section" class="mb-8">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="lesson-title" class="text-2xl font-semibold text-blue-700">Hướng dẫn rửa tay</h2>
                </div>
                
                <div class="video-container mb-6 rounded-lg overflow-hidden shadow-lg">
                    <div id="start-screen" class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-50">
                        <button id="start-btn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-lg text-lg">
                            Bắt đầu bài học
                        </button>
                    </div>
                    <video id="lesson-video">
                        <source src="ruatay.mp4" type="video/mp4">
                        Trình duyệt của bạn không hỗ trợ video.
                    </video>
                </div>
                
                <div id="quiz-section" class="hidden bg-white p-6 rounded-lg shadow-md">
                    <h3 class="text-xl font-semibold mb-4 text-blue-600">Quiz Time!</h3>
                    <p id="quiz-question" class="mb-4 text-lg"></p>
                    
                    <div id="quiz-options" class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">
                        <!-- Options will be added here by JavaScript -->
                    </div>
                    
                    <div id="feedback" class="hidden p-4 rounded-lg mb-4 text-center text-xl font-bold"></div>
                    
                    <button id="continue-btn" class="hidden bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg text-lg">
                        Continue <i class="fas fa-play ml-2"></i>
                    </button>
                </div>
            </section>
            
            <!-- Celebration Modal -->
            <div id="celebration-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                <div class="bg-white p-8 rounded-lg max-w-md text-center">
                    <div class="text-6xl mb-4 text-yellow-400">
                        <i class="fas fa-trophy"></i>
                    </div>
                    <h3 class="text-3xl font-bold mb-4 text-blue-600">Great Job!</h3>
                    <p class="text-xl mb-6">You completed the lesson successfully!</p>
                    <button id="close-modal" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-lg">
                        Continue Learning
                    </button>
                </div>
            </div>
        </main>
        
        <!-- Footer -->
        <footer class="mt-12 text-center text-gray-600">
            <p>© 2023 Learning Journey. Designed with ❤️ for children with autism.</p>
            <div class="mt-4 flex justify-center space-x-4">
                <button class="p-2 rounded-full bg-blue-100 text-blue-600">
                    <i class="fas fa-volume-up"></i>
                </button>
                <button class="p-2 rounded-full bg-green-100 text-green-600">
                    <i class="fas fa-text-size"></i>
                </button>
                <button class="p-2 rounded-full bg-yellow-100 text-yellow-600">
                    <i class="fas fa-palette"></i>
                </button>
            </div>
        </footer>
    </div>

    <script>
        // Lesson data (chỉ có 1 bài học: Hướng dẫn rửa tay)
        const lesson = {
            id: 1,
            title: "Hướng dẫn rửa tay",
            quizPoints: [15, 30], // thời gian dừng video để hiển thị câu hỏi (giây)
            quizzes: [
                {
                    question: "Bước đầu tiên khi rửa tay là gì?",
                    options: ["Thoa xà phòng", "Làm ướt tay", "Lau khô tay", "Chà tay"],
                    correct: 1 // Đáp án đúng: "Làm ướt tay"
                },
                {
                    question: "Bạn cần chà tay trong bao lâu?",
                    options: ["10 giây", "20 giây", "40 giây", "60 giây"],
                    correct: 2 // Đáp án đúng: "40 giây"
                }
            ],
            completed: false
        };

        // DOM elements
        const videoSection = document.getElementById('video-section');
        const lessonTitle = document.getElementById('lesson-title');
        const lessonVideo = document.getElementById('lesson-video');
        const quizSection = document.getElementById('quiz-section');
        const quizQuestion = document.getElementById('quiz-question');
        const quizOptions = document.getElementById('quiz-options');
        const feedback = document.getElementById('feedback');
        const continueBtn = document.getElementById('continue-btn');
        const celebrationModal = document.getElementById('celebration-modal');
        const closeModal = document.getElementById('close-modal');
        const progressBar = document.getElementById('progress-bar');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');

        // State variables
        let currentQuizIndex = 0;

        // Initialize the app
        function init() {
            // Hiển thị bài học ngay lập tức
            startLesson();
            setupEventListeners();
        }

        // Start the lesson
        function startLesson() {
            lessonTitle.textContent = lesson.title;
            videoSection.classList.remove('hidden');
            
            // Bắt đầu phát video khi người dùng nhấn nút "Bắt đầu"
            startBtn.addEventListener('click', () => {
                startScreen.classList.add('hidden');
                lessonVideo.play();
            });

            lessonVideo.addEventListener('timeupdate', checkQuizPoints);
        }

        // Setup event listeners
        function setupEventListeners() {
            // Continue button
            continueBtn.addEventListener('click', function() {
                quizSection.classList.add('hidden');
                feedback.classList.add('hidden');
                continueBtn.classList.add('hidden');
                
                lessonVideo.play();
                
                // Kiểm tra nếu đã hoàn thành tất cả câu hỏi
                if (currentQuizIndex >= lesson.quizzes.length) {
                    lesson.completed = true;
                    updateProgress();
                    celebrationModal.classList.remove('hidden');
                }
            });
            
            // Close modal button
            closeModal.addEventListener('click', function() {
                celebrationModal.classList.add('hidden');
                lessonVideo.currentTime = 0; // Reset video
                lessonVideo.play();
                currentQuizIndex = 0; // Reset quiz
                updateProgress();
            });
        }

        // Check if video reached a quiz point
        function checkQuizPoints() {
            const currentTime = lessonVideo.currentTime;
            
            if (currentQuizIndex < lesson.quizPoints.length && 
                currentTime >= lesson.quizPoints[currentQuizIndex] && 
                currentTime < lesson.quizPoints[currentQuizIndex] + 1) {
                
                lessonVideo.pause();
                showQuiz(currentQuizIndex);
            }
        }

        // Show quiz
        function showQuiz(index) {
            const quiz = lesson.quizzes[index];
            
            quizQuestion.textContent = quiz.question;
            
            quizOptions.innerHTML = '';
            quiz.options.forEach((option, i) => {
                const button = document.createElement('button');
                button.className = 'option-btn bg-blue-100 hover:bg-blue-200 text-blue-800 font-semibold py-3 px-4 rounded-lg text-lg';
                button.textContent = option;
                button.dataset.index = i;
                button.addEventListener('click', handleOptionClick);
                quizOptions.appendChild(button);
            });
            
            quizSection.classList.remove('hidden');
        }

        // Handle option click
        function handleOptionClick(e) {
            const selectedIndex = parseInt(e.target.dataset.index);
            const correctIndex = lesson.quizzes[currentQuizIndex].correct;
            
            // Disable all options
            const options = quizOptions.querySelectorAll('button');
            options.forEach(option => {
                option.disabled = true;
                option.classList.remove('bg-blue-100', 'hover:bg-blue-200', 'text-blue-800');
            });
            
            // Mark correct and incorrect answers
            if (selectedIndex === correctIndex) {
                e.target.classList.add('bg-green-500', 'text-white');
                feedback.textContent = "Correct! Great job!";
                feedback.className = "hidden p-4 rounded-lg mb-4 text-center text-xl font-bold bg-green-100 text-green-800";
                feedback.classList.remove('hidden');
                feedback.classList.add('correct-animation');
                
                playSound('correct');
                currentQuizIndex++;
            } else {
                e.target.classList.add('bg-red-500', 'text-white');
                options[correctIndex].classList.add('bg-green-500', 'text-white');
                feedback.textContent = "Try again! You can do it!";
                feedback.className = "hidden p-4 rounded-lg mb-4 text-center text-xl font-bold bg-red-100 text-red-800";
                feedback.classList.remove('hidden');
                feedback.classList.add('incorrect-animation');
                
                playSound('incorrect');
            }
            
            // Show continue button after a delay
            setTimeout(() => {
                continueBtn.classList.remove('hidden');
            }, 1500);
        }

        // Play feedback sounds
        function playSound(type) {
            const sound = new Audio();
            sound.src = type === 'correct' ? 
                'https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3' : 
                'https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3';
            sound.play();
        }

        // Update progress bar
        function updateProgress() {
            if (lesson.completed) {
                progressBar.style.width = '100%';
            }
        }

        // Initialize the app when the page loads
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
