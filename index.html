<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Journey - Hướng dẫn rửa tay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes correct {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes incorrect {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        @keyframes star-animation {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        .correct-animation {
            animation: correct 0.5s ease-in-out;
        }

        .incorrect-animation {
            animation: incorrect 0.4s ease-in-out;
        }

        .star-animation {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            color: #ffd700;
            animation: star-animation 1s ease-in-out;
        }

        .progress-bar {
            transition: width 0.3s ease-in-out;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
        }

        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .option-btn {
            transition: all 0.2s ease;
            width: 100%;
            height: 150px; /* Tăng kích thước hình ảnh */
            object-fit: cover;
            border-radius: 12px;
            cursor: pointer;
            border: 3px solid #a3bffa; /* Viền màu pastel */
        }

        .option-btn:hover {
            transform: translateY(-2px);
        }

        .sensory-friendly {
            background-color: #e6f0fa; /* Màu nền pastel nhẹ nhàng */
            color: #333;
            font-family: 'Comic Sans MS', 'Open Sans', sans-serif; /* Font thân thiện */
        }

        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 4px solid #a3bffa;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #quiz-section {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff3e6; /* Màu nền modal pastel */
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 20;
            width: 90%;
            max-width: 450px; /* Giảm kích thước modal để không gây áp lực */
            display: none;
            text-align: center;
            position: relative;
        }

        #quiz-section.show {
            display: block;
        }

        #feedback {
            display: none;
            text-align: center;
            margin-top: 10px;
            font-size: 1.25rem; /* Tăng kích thước chữ feedback */
        }

        #start-screen { z-index: 10; }

        h1, h2, h3, p {
            color: #4a5568; /* Màu chữ nhẹ nhàng */
        }

        #start-btn {
            background-color: #b2f5ea; /* Màu pastel xanh nhạt */
            color: #2d3748;
            border: 2px solid #81e6d9;
        }

        #start-btn:hover {
            background-color: #81e6d9;
        }
    </style>
</head>
<body class="sensory-friendly min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-5xl font-bold mb-2">Learning Journey 🌈</h1>
            <p class="text-xl">Cùng học rửa tay thật vui nhé! 🐾</p>
            <div class="w-full bg-gray-200 rounded-full h-4 mt-4">
                <div id="progress-bar" class="progress-bar bg-teal-300 h-4 rounded-full" style="width: 0%"></div>
            </div>
        </header>
        
        <!-- Main Content -->
        <main>
            <!-- Video Player Section -->
            <section id="video-section" class="mb-8">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="lesson-title" class="text-3xl font-semibold">Hướng dẫn rửa tay 🖐️</h2>
                </div>
                
                <div class="video-container mb-6 rounded-lg overflow-hidden shadow-lg">
                    <div id="start-screen" class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-50">
                        <button id="start-btn" class="font-bold py-3 px-6 rounded-lg text-xl">
                            Bắt đầu nào! 🚀
                        </button>
                    </div>
                    <video id="lesson-video">
                        <source src="ruatay.mp4" type="video/mp4">
                        Trình duyệt của bạn không hỗ trợ video.
                    </video>
                </div>
                
                <div id="quiz-section" class="bg-white p-6 rounded-lg shadow-md">
                    <h3 id="step-instruction" class="text-2xl font-semibold mb-4">Chọn bước tiếp theo nhé! 😊</h3>
                    
                    <div id="quiz-options" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        <!-- Options will be added here by JavaScript -->
                    </div>
                    
                    <div id="feedback" class="hidden p-4 rounded-lg mb-4 text-center text-xl font-bold"></div>
                </div>
            </section>
            
            <!-- Celebration Modal -->
            <div id="celebration-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                <div class="bg-white p-8 rounded-lg max-w-md text-center">
                    <div class="text-6xl mb-4 text-yellow-400">
                        <i class="fas fa-trophy"></i>
                    </div>
                    <h3 class="text-3xl font-bold mb-4 text-teal-600">Giỏi quá! 🎉</h3>
                    <p class="text-xl mb-6">Bạn đã hoàn thành bài học thật tuyệt! 🌟</p>
                    <button id="close-modal" class="bg-teal-400 hover:bg-teal-500 text-white font-bold py-2 px-6 rounded-lg">
                        Học tiếp nào! 🚀
                    </button>
                </div>
            </div>
        </main>
        
        <!-- Footer -->
        <footer class="mt-12 text-center text-gray-600">
            <p>© 2023 Learning Journey. Cùng học vui vẻ nhé! 🐾</p>
            <div class="mt-4 flex justify-center space-x-4">
                <button class="p-2 rounded-full bg-teal-100 text-teal-600">
                    <i class="fas fa-volume-up"></i>
                </button>
                <button class="p-2 rounded-full bg-indigo-100 text-indigo-600">
                    <i class="fas fa-text-size"></i>
                </button>
                <button class="p-2 rounded-full bg-yellow-100 text-yellow-600">
                    <i class="fas fa-palette"></i>
                </button>
            </div>
        </footer>
    </div>

    <script>
        // Lesson data with image-based steps for hand washing (4 steps, 3 options each)
        const lesson = {
            id: 1,
            title: "Hướng dẫn rửa tay",
            steps: [
                {
                    instruction: "Chọn bước tiếp theo nhé! 😊",
                    options: [
                        { src: "tap.png", alt: "Vòi nước", correct: true },
                        { src: "soap.png", alt: "Xà phòng", correct: false },
                        { src: "towel.png", alt: "Khăn lau", correct: false }
                    ],
                    correctStep: "Làm ướt tay"
                },
                {
                    instruction: "Chọn bước tiếp theo nhé! 😊",
                    options: [
                        { src: "tap.png", alt: "Vòi nước", correct: false },
                        { src: "soap.png", alt: "Xà phòng", correct: true },
                        { src: "hands.png", alt: "Chà tay", correct: false }
                    ],
                    correctStep: "Thoa xà phòng"
                },
                {
                    instruction: "Chọn bước tiếp theo nhé! 😊",
                    options: [
                        { src: "soap.png", alt: "Xà phòng", correct: false },
                        { src: "towel.png", alt: "Khăn lau", correct: false },
                        { src: "hands.png", alt: "Chà tay", correct: true }
                    ],
                    correctStep: "Chà tay"
                },
                {
                    instruction: "Chọn bước tiếp theo nhé! 😊",
                    options: [
                        { src: "tap.png", alt: "Vòi nước", correct: false },
                        { src: "towel.png", alt: "Khăn lau", correct: true },
                        { src: "hands.png", alt: "Chà tay", correct: false }
                    ],
                    correctStep: "Lau khô tay"
                }
            ],
            completed: false
        };

        // DOM elements
        const videoSection = document.getElementById('video-section');
        const lessonTitle = document.getElementById('lesson-title');
        const lessonVideo = document.getElementById('lesson-video');
        const quizSection = document.getElementById('quiz-section');
        const stepInstruction = document.getElementById('step-instruction');
        const quizOptions = document.getElementById('quiz-options');
        const feedback = document.getElementById('feedback');
        const celebrationModal = document.getElementById('celebration-modal');
        const closeModal = document.getElementById('close-modal');
        const progressBar = document.getElementById('progress-bar');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');

        // State variables
        let currentStepIndex = 0;
        let nextStepTime = 40;

        // Initialize the app
        function init() {
            startLesson();
            setupEventListeners();
        }

        // Start the lesson
        function startLesson() {
            lessonTitle.textContent = lesson.title;
            videoSection.classList.remove('hidden');
            
            startBtn.addEventListener('click', () => {
                startScreen.classList.add('hidden');
                lessonVideo.play();
            });

            lessonVideo.addEventListener('timeupdate', checkStepPoints);
        }

        // Setup event listeners
        function setupEventListeners() {
            closeModal.addEventListener('click', function() {
                celebrationModal.classList.add('hidden');
                lessonVideo.currentTime = 0;
                lessonVideo.play();
                currentStepIndex = 0;
                nextStepTime = 40;
                updateProgress();
            });
        }

        // Check if video reached a step point
        function checkStepPoints() {
            const currentTime = lessonVideo.currentTime;
            
            if (currentStepIndex < lesson.steps.length && 
                currentTime >= nextStepTime && 
                currentTime < nextStepTime + 1) {
                
                lessonVideo.pause();
                showStep(currentStepIndex);
            }
        }

        // Show step
        function showStep(index) {
            const step = lesson.steps[index];
            
            stepInstruction.textContent = step.instruction;
            quizOptions.innerHTML = '';
            
            step.options.forEach((option, i) => {
                const img = document.createElement('img');
                img.className = 'option-btn bg-gray-200';
                img.src = option.src;
                img.alt = option.alt;
                img.dataset.index = i;
                img.dataset.correct = option.correct;
                img.addEventListener('click', () => handleOptionClick(index, i));
                quizOptions.appendChild(img);
            });
            
            quizSection.classList.add('show');
        }

        // Handle option click
        function handleOptionClick(index, selectedIndex) {
            const step = lesson.steps[index];
            const options = quizOptions.querySelectorAll('img');
            const selectedOption = step.options[selectedIndex];
            
            options.forEach(option => {
                option.classList.remove('bg-blue-100', 'hover:bg-blue-200');
                option.style.opacity = '0.5';
            });
            
            if (selectedOption.correct) {
                options[selectedIndex].classList.add('bg-teal-400');
                feedback.textContent = `Giỏi quá! Bước tiếp theo: ${step.correctStep} 🌟`;
                feedback.className = "p-4 rounded-lg mb-4 text-center text-xl font-bold bg-teal-100 text-teal-800 correct-animation";
                feedback.classList.remove('hidden');
                
                // Thêm hiệu ứng ngôi sao
                const star = document.createElement('span');
                star.className = 'star-animation';
                star.textContent = '⭐';
                quizSection.appendChild(star);
                
                playSound('correct');
                currentStepIndex++;
                
                if (currentStepIndex < lesson.steps.length) {
                    if (currentStepIndex === 1) {
                        nextStepTime = lessonVideo.currentTime + 5;
                    } else if (currentStepIndex === 2) {
                        nextStepTime = lessonVideo.currentTime + 6;
                    } else if (currentStepIndex === 3) {
                        nextStepTime = lessonVideo.currentTime + 9;
                    }
                }
                
                updateProgress();
                
                setTimeout(() => {
                    quizSection.classList.remove('show');
                    feedback.classList.add('hidden');
                    lessonVideo.play();
                    if (currentStepIndex >= lesson.steps.length) {
                        lesson.completed = true;
                        celebrationModal.classList.remove('hidden');
                    }
                }, 1500);
            } else {
                options[selectedIndex].classList.add('bg-red-300');
                feedback.textContent = "Không sao đâu, thử lại nhé! 🌟";
                feedback.className = "p-4 rounded-lg mb-4 text-center text-xl font-bold bg-red-100 text-red-800 incorrect-animation";
                feedback.classList.remove('hidden');
                playSound('incorrect');
                
                setTimeout(() => {
                    feedback.classList.add('hidden');
                    options.forEach(option => {
                        option.style.opacity = '1';
                        option.classList.add('bg-blue-100', 'hover:bg-blue-200');
                        option.classList.remove('bg-red-300', 'bg-teal-400');
                    });
                }, 1500);
            }
        }

        // Play feedback sounds
        function playSound(type) {
            const sound = new Audio();
            sound.src = type === 'correct' ? 
                'https://assets.mixkit.co/sfx/preview/mixkit-positive-notification-951.mp3' : 
                'https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3';
            sound.play();
        }

        // Update progress bar
        function updateProgress() {
            const totalSteps = lesson.steps.length;
            const progress = (currentStepIndex / totalSteps) * 100;
            progressBar.style.width = `${progress}%`;
            if (lesson.completed) {
                progressBar.style.width = '100%';
            }
        }

        // Initialize the app when the page loads
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
